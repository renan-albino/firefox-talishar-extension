<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salvar Partida - Talishar Log Exporter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #12121a;
      color: #f3f4f6;
      padding: 20px;
      line-height: 1.5;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2d2d3f;
    }
    .header h1 {
      font-size: 17px;
      color: #ff7043;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .match-id {
      font-size: 11px;
      color: #9ca3af;
      font-family: monospace;
    }
    /* Match Summary Card */
    .summary-card {
      background: #1c1c28;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #2d2d3f;
      border-left: 4px solid #f59e0b;
    }
    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .result-badge {
      font-weight: 700;
      font-size: 15px;
    }
    .match-time {
      font-size: 12px;
      color: #9ca3af;
    }
    .matchup-text {
      font-size: 14px;
      margin-bottom: 10px;
      color: #e5e7eb;
    }
    .matchup-text strong {
      color: #fff;
    }
    .matchup-text em {
      color: #9ca3af;
      font-style: normal;
      margin: 0 4px;
    }
    .avg-stats-row {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: #d1d5db;
    }
    .avg-stats-row .player-stat {
      color: #6ee7b7;
      font-weight: 700;
    }
    .avg-stats-row .opp-stat {
      color: #fca5a5;
      font-weight: 700;
    }
    /* Alert banner for opponent stats */
    .opp-alert {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 12px;
      font-size: 12px;
      color: #fca5a5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .opp-alert.success {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }
    .opp-alert-text {
      flex: 1;
      min-width: 220px;
    }
    .btn-sync-stats {
      background: #2f3442;
      border: 1px solid #4b5563;
      color: #f3f4f6;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-sync-stats:hover {
      background: #374151;
    }
    /* Form fields */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cfd8dc;
      margin-bottom: 5px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      background: #1c1c28;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #fff;
      padding: 9px 11px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: #ff7043;
    }
    textarea {
      resize: vertical;
      font-family: inherit;
    }
    .field-hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
      display: block;
    }
    /* Actions */
    .actions-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 11px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, background 0.2s;
    }
    .btn:hover {
      opacity: 0.92;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-sheets {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    .btn-open-sheet {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      font-size: 12px;
      padding: 9px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-secondary {
      flex: 1;
      background: #242433;
      color: #f3f4f6;
      border: 1px solid #374151;
      font-size: 12px;
      padding: 9px;
    }
    .btn-close {
      background: transparent;
      color: #9ca3af;
      font-size: 12px;
      padding: 6px;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-close:hover {
      color: #fff;
    }
    #export-status {
      min-height: 20px;
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚔️ Salvar e Exportar Partida</h1>
    <span class="match-id" id="display-match-id">Carregando...</span>
  </div>

  <!-- Summary Card -->
  <div class="summary-card" id="summary-card">
    <div class="summary-top">
      <span class="result-badge" id="display-result">-</span>
      <span class="match-time" id="display-time">-</span>
    </div>
    <div class="matchup-text" id="display-matchup">
      <strong id="display-player-hero">-</strong>
      <em>vs</em>
      <strong id="display-opp-hero">-</strong>
    </div>
    <div class="avg-stats-row">
      <div>Meu Valor Médio/Turno: <span class="player-stat" id="display-player-avg">-</span></div>
      <div>Oponente: <span class="opp-stat" id="display-opp-avg">-</span></div>
    </div>

    <div class="opp-alert" id="opp-alert-box">
      <span class="opp-alert-text" id="opp-alert-text">
        💡 <strong>Dica:</strong> No Talishar, clique na aba do oponente nas estatísticas ou insira manualmente abaixo.
      </span>
      <button type="button" class="btn-sync-stats" id="btn-sync-stats">🔄 Sincronizar do Jogo</button>
    </div>
  </div>

  <!-- Form -->
  <div class="form-grid">
    <div class="form-group">
      <label for="input-player-name">Jogador:</label>
      <input type="text" id="input-player-name" placeholder="Ex: MeuNick" />
    </div>
    <div class="form-group">
      <label for="select-went-first">Iniciou a Partida?</label>
      <select id="select-went-first">
        <option value="">Não especificado (-)</option>
        <option value="true">Sim (Turno 1 meu)</option>
        <option value="false">Não (Turno 1 oponente)</option>
      </select>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label for="input-player-avg" style="color: #6ee7b7;">Meu Valor Médio/Turno:</label>
      <input type="text" id="input-player-avg" placeholder="Ex: 14,8" style="color: #6ee7b7; font-weight: 600;" />
    </div>
    <div class="form-group">
      <label for="input-opp-avg" style="color: #fca5a5;">Valor Médio/Turno Oponente:</label>
      <input type="text" id="input-opp-avg" placeholder="Ex: 11,2" style="color: #fca5a5; font-weight: 600;" />
    </div>
  </div>

  <div class="form-group">
    <label for="textarea-notes">Notas da Partida (observações, erros, aprendizados):</label>
    <textarea id="textarea-notes" rows="3" placeholder="Ex: Oponente utilizou combo agressivo no turno 3. Priorizar bloqueios..."></textarea>
  </div>

  <div class="form-group">
    <label for="input-sideboard">Cartas Fora do Deck / Sideboard (separadas por vírgula):</label>
    <input type="text" id="input-sideboard" placeholder="Ex: Pummel (Red), Sink Below" />
    <span class="field-hint">Identificado automaticamente durante o setup. Ajuste se necessário caso o main deck tenha menos de 60 cartas.</span>
  </div>

  <div id="export-status"></div>

  <!-- Actions -->
  <div class="actions-section">
    <button type="button" class="btn btn-sheets" id="btn-save-sheets">
      📊 Salvar no Google Sheets
    </button>

    <button type="button" class="btn btn-open-sheet" id="btn-open-sheet" style="display: none;">
      🌐 Abrir Planilha Google
    </button>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" id="btn-download-csv">
        📥 Baixar CSV (Excel PT-BR)
      </button>
      <button type="button" class="btn btn-secondary" id="btn-download-log">
        📄 Baixar Log Completo (.txt)
      </button>
    </div>

    <button type="button" class="btn-close" id="btn-close-window">
      Fechar Janela
    </button>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
