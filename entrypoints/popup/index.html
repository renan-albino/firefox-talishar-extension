<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talishar Log Exporter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 350px;
      margin: 0;
      padding: 16px;
      background-color: #1a1a24;
      color: #f1f1f1;
    }
    h1 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #ff7043;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      font-size: 12px;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
      color: #cfd8dc;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background-color: #242433;
      color: #fff;
      font-size: 12px;
    }
    input[type="url"]:focus {
      outline: none;
      border-color: #ff7043;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #cfd8dc;
      cursor: pointer;
    }
    .checkbox-group input {
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff7043, #f4511e);
      color: white;
    }
    .btn-secondary {
      background-color: #374151;
      color: #e5e7eb;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.4;
      min-height: 16px;
    }
    .help-box {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background-color: #242433;
      font-size: 11px;
      color: #9ca3af;
      border-left: 3px solid #ff7043;
    }
  </style>
</head>
<body>
  <h1>⚔️ Talishar Log Exporter</h1>
  
  <div class="form-group">
    <label for="webhook-url">URL do Webhook (Google Sheets):</label>
    <input
      type="url"
      id="webhook-url"
      placeholder="https://script.google.com/macros/s/.../exec"
      spellcheck="false"
    />
  </div>

  <label class="checkbox-group">
    <input type="checkbox" id="auto-open" />
    <span>Abrir modal de notas automaticamente ao final da partida</span>
  </label>

  <div class="btn-row">
    <button id="test-btn" class="btn btn-secondary">Testar Conexão</button>
    <button id="save-btn" class="btn btn-primary">Salvar</button>
  </div>

  <div id="status" class="status-msg"></div>

  <div class="help-box">
    💡 <strong>Dica:</strong> Cole a URL do Webhook gerada a partir do script <code>google-apps-script/Code.gs</code> na sua planilha do Google Sheets.
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
