<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talishar Log Exporter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: #1e1e24;
      color: #f1f1f1;
    }
    h1 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #ff5e62;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      font-size: 12px;
      display: block;
      margin-bottom: 6px;
      color: #aaa;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background-color: #2b2b36;
      color: #fff;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .btn {
      background: linear-gradient(135deg, #ff9966, #ff5e62);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 13px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>⚔️ Talishar Log Exporter</h1>
  <div>
    <label for="webhook-url">URL do Webhook (Google Apps Script):</label>
    <input type="url" id="webhook-url" placeholder="https://script.google.com/macros/s/.../exec">
    <button id="save-btn" class="btn">Salvar Configurações</button>
    <div id="status" class="status-msg"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
