<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talishar Log Exporter</title>
  <style>
    html {
      box-sizing: border-box;
      width: 380px;
      min-height: 500px;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      min-height: 500px;
      margin: 0;
      padding: 16px;
      background-color: #1a1a24;
      color: #f1f1f1;
      overflow-x: hidden;
    }
    h1 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #ff7043;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* Tabs */
    .tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid #374151; }
    .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #9ca3af; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; }
    .tab.active { color: #ff7043; border-bottom: 2px solid #ff7043; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Dashboard */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-box { background: #242433; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #2d2d3d; }
    .stat-value { font-size: 17px; font-weight: 700; color: #fff; margin: 4px 0; }
    .stat-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; font-weight: 600; }
    .stat-value.win { color: #10b981; }
    .stat-value.loss { color: #ef4444; }
    
    .mm-pm-container { background: #242433; padding: 10px; border-radius: 6px; margin-bottom: 14px; border: 1px solid #2d2d3d; display: flex; justify-content: space-between; }
    .mm-pm-col { text-align: center; flex: 1; }
    .mm-pm-title { font-size: 11px; font-weight: 600; cursor: help; border-bottom: 1px dotted #9ca3af; padding-bottom: 2px; }

    #live-status-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 600;
      background: #374151;
      color: #9ca3af;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
    }

    /* Forms */
    .form-group {
      margin-bottom: 12px;
    }
    label {
      font-size: 12px;
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
      color: #cfd8dc;
    }
    input[type="url"], input[type="text"], input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background-color: #242433;
      color: #fff;
      font-size: 12px;
    }
    input[type="url"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: #ff7043;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #cfd8dc;
      cursor: pointer;
    }
    .checkbox-group input {
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff7043, #f4511e);
      color: white;
    }
    .btn-secondary {
      background-color: #374151;
      color: #e5e7eb;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.4;
      min-height: 16px;
    }
    .help-box {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background-color: #242433;
      font-size: 11px;
      color: #9ca3af;
      border-left: 3px solid #ff7043;
    }
  </style>
</head>
<body>
  <h1>⚔️ Talishar Log Exporter</h1>

  <div id="live-status-banner">
    <div class="status-dot" id="live-status-dot"></div>
    <span id="live-status-text">Verificando status do Talishar...</span>
  </div>

  <button id="export-last-match-btn" type="button" style="
    width: 100%;
    margin-bottom: 16px;
    padding: 10px;
    background: linear-gradient(135deg, #ff7043, #f4511e);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(244, 81, 30, 0.3);
  ">📝 Salvar/Exportar Última Partida Jogada</button>

  <div class="tabs">
    <div class="tab active" data-target="tab-stats">Estatísticas</div>
    <div class="tab" data-target="tab-config">Configurações</div>
  </div>

  <div id="tab-stats" class="tab-content active">
    <div class="dashboard-grid">
      <div class="stat-box">
        <div class="stat-label">Winrate Local</div>
        <div class="stat-value" id="dash-winrate">-</div>
        <div class="stat-label" id="dash-matches-count">0 partidas</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Herói Principal</div>
        <div class="stat-value" style="font-size: 13px;" id="dash-main-hero">-</div>
      </div>
    </div>

    <div class="mm-pm-container">
      <div class="mm-pm-col">
        <span class="mm-pm-title" title="Melhor Matchup: Herói contra quem você mais ganhou">🏆 M.M.</span>
        <div class="stat-value win" style="font-size: 12px; margin-top: 8px;" id="dash-best-matchup">-</div>
      </div>
      <div class="mm-pm-col">
        <span class="mm-pm-title" title="Pior Matchup: Herói contra quem você mais perdeu">💀 P.M.</span>
        <div class="stat-value loss" style="font-size: 12px; margin-top: 8px;" id="dash-worst-matchup">-</div>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #374151; margin: 16px 0;">

    <div style="font-size: 12px; margin-bottom: 8px; font-weight: 600; color: #cfd8dc;">Dados Locais</div>
    
    <div class="btn-row" style="margin-bottom: 8px;">
      <button id="export-csv-btn" class="btn btn-primary" style="flex: 2;">📥 Baixar Histórico Único (CSV)</button>
    </div>
    
    <div class="form-group" style="margin-top: 12px; background: #242433; padding: 10px; border-radius: 6px; border: 1px dashed #4b5563;">
      <label for="import-csv-file" style="margin-bottom: 4px; font-size: 11px;">Importar CSV Anterior:</label>
      <input type="file" id="import-csv-file" accept=".csv" style="padding: 4px; border: none; font-size: 11px;" />
    </div>

    <div id="stats-status" class="status-msg"></div>
  </div>

  <div id="tab-config" class="tab-content">
    <button id="open-sheet-btn" class="btn" style="
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      margin-bottom: 14px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    ">
      📊 Abrir Planilha Google
    </button>

    <div class="form-group">
      <label for="player-name">Seu Nome / Nickname (Jogador):</label>
      <input
        type="text"
        id="player-name"
        placeholder="Ex: SeuNick"
        spellcheck="false"
      />
    </div>
    
    <div class="form-group">
      <label for="webhook-url">URL do Webhook (Google Sheets):</label>
      <input
        type="url"
        id="webhook-url"
        placeholder="https://script.google.com/macros/s/.../exec"
        spellcheck="false"
      />
    </div>

    <div class="form-group">
      <label for="spreadsheet-url">Link Direto da Planilha (opcional):</label>
      <input
        type="url"
        id="spreadsheet-url"
        placeholder="https://docs.google.com/spreadsheets/d/..."
        spellcheck="false"
      />
    </div>

    <label class="checkbox-group">
      <input type="checkbox" id="auto-open" />
      <span>Abrir modal de notas automaticamente ao final da partida</span>
    </label>

    <div class="btn-row">
      <button id="test-btn" class="btn btn-secondary">Testar Conexão</button>
      <button id="save-btn" class="btn btn-primary">Salvar</button>
    </div>

    <div id="status" class="status-msg"></div>

    <div class="help-box">
      💡 <strong>Dica:</strong> Cole a URL do Webhook gerada a partir do script <code>google-apps-script/Code.gs</code> na sua planilha do Google Sheets.
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
